<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements - Campus Connect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Floating Campus Background Animation -->
  <div class="campus-bg-animation">
    <span class="floating-icon">📚</span>
    <span class="floating-icon">🎓</span>
    <span class="floating-icon">✏️</span>
    <span class="floating-icon">🔬</span>
    <span class="floating-icon">💡</span>
    <span class="floating-icon">🏛️</span>
    <span class="floating-icon">📝</span>
    <span class="floating-icon">🎯</span>
    <span class="floating-icon">🌟</span>
    <span class="floating-icon">📖</span>
    <span class="floating-icon">🎨</span>
    <span class="floating-icon">⚡</span>
  </div>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo-icon">🎓</div>
        <span class="sidebar-title">Campus Connect</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="announcements.html" class="nav-link active">
          <span class="nav-icon">📢</span>
          <span>Announcements</span>
        </a>
        <a href="events.html" class="nav-link">
          <span class="nav-icon">📅</span>
          <span>Events</span>
        </a>
        <a href="clubs.html" class="nav-link">
          <span class="nav-icon">🤝</span>
          <span>Clubs</span>
        </a>
        <a href="resources.html" class="nav-link">
          <span class="nav-icon">📚</span>
          <span>Resources</span>
        </a>
        <a href="lostfound.html" class="nav-link">
          <span class="nav-icon">🔍</span>
          <span>Lost & Found</span>
        </a>
        <a href="feedback.html" class="nav-link">
          <span class="nav-icon">💬</span>
          <span>Feedback</span>
        </a>
        <a href="notifications.html" class="nav-link">
          <span class="nav-icon">🔔</span>
          <span>Notifications</span>
        </a>
        <a href="profile.html" class="nav-link">
          <span class="nav-icon">👤</span>
          <span>My Profile</span>
        </a>
        <a href="admin.html" class="nav-link admin-only-nav" style="display: none;">
          <span class="nav-icon">⚙️</span>
          <span>Admin Panel</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-snippet">
          <div id="sidebar-user-avatar" class="user-avatar">U</div>
          <div class="user-details">
            <div id="sidebar-user-name" class="user-name">User</div>
            <span id="sidebar-user-role" class="user-role-badge role-student">student</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Top Navbar -->
      <header class="top-navbar">
        <div class="navbar-left">
          <button id="menu-toggle-btn" class="menu-toggle-btn">☰</button>
          <h1 class="page-title">Campus Announcements</h1>
        </div>

        <div class="navbar-right">
          <a href="notifications.html" class="nav-action-btn" title="Notifications">
            🔔
            <span id="nav-notification-badge" class="badge-count" style="display: none;">0</span>
          </a>
          <a href="profile.html" class="nav-action-btn" title="Profile">👤</a>
          <button onclick="logout()" class="logout-btn-nav">Logout</button>
        </div>
      </header>

      <!-- Content Body -->
      <main class="content-body">
        <!-- Toolbar & Filter Group -->
        <div class="page-toolbar">
          <div class="search-filters-group">
            <div class="search-input-wrapper">
              <span class="search-icon-inside">🔍</span>
              <input type="text" id="announcement-search" placeholder="Search announcements by title or keyword...">
            </div>

            <select id="announcement-category-filter" class="filter-select">
              <option value="All">All Categories</option>
              <option value="Academic">Academic</option>
              <option value="Examination">Examination</option>
              <option value="Placement">Placement</option>
              <option value="General">General</option>
              <option value="Emergency">Emergency</option>
              <option value="Event">Event</option>
            </select>

            <select id="announcement-priority-filter" class="filter-select">
              <option value="All">All Priorities</option>
              <option value="Urgent">Urgent</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>

          <button class="btn btn-primary faculty-admin-only" style="display: none;" onclick="openModal('create-announcement-modal')">
            + New Announcement
          </button>
        </div>

        <!-- Announcements Grid -->
        <div id="announcements-container" class="items-grid">
          <!-- Announcements dynamically loaded by app.js -->
        </div>
      </main>
    </div>
  </div>

  <!-- Create Announcement Modal (Faculty / Admin Only) -->
  <div id="create-announcement-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Publish New Announcement</h3>
        <button class="modal-close-btn" onclick="closeModal('create-announcement-modal')">✕</button>
      </div>

      <form id="create-announcement-form" onsubmit="handleCreateAnnouncement(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="ann-title">Title *</label>
            <input type="text" id="ann-title" class="form-control" placeholder="e.g. End Semester Exam Schedule Released" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="ann-category">Category</label>
              <select id="ann-category" class="form-control">
                <option value="Academic">Academic</option>
                <option value="Examination">Examination</option>
                <option value="Placement">Placement</option>
                <option value="General" selected>General</option>
                <option value="Emergency">Emergency</option>
                <option value="Event">Event</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="ann-priority">Priority</label>
              <select id="ann-priority" class="form-control">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
                <option value="Urgent">Urgent</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="ann-description">Description / Content *</label>
            <textarea id="ann-description" class="form-control" rows="4" placeholder="Enter detailed notice information..." required></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="ann-attachment">Attachment URL (Optional)</label>
            <input type="url" id="ann-attachment" class="form-control" placeholder="https://example.com/document.pdf">
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('create-announcement-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Publish Notice</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', loadAnnouncements);
  </script>
</body>
</html>
