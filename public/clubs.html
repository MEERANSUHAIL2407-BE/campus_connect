<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Clubs - Campus Connect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Floating Campus Background Animation -->
  <div class="campus-bg-animation">
    <span class="floating-icon">📚</span>
    <span class="floating-icon">🎓</span>
    <span class="floating-icon">✏️</span>
    <span class="floating-icon">🔬</span>
    <span class="floating-icon">💡</span>
    <span class="floating-icon">🏛️</span>
    <span class="floating-icon">📝</span>
    <span class="floating-icon">🎯</span>
    <span class="floating-icon">🌟</span>
    <span class="floating-icon">📖</span>
    <span class="floating-icon">🎨</span>
    <span class="floating-icon">⚡</span>
  </div>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo-icon">🎓</div>
        <span class="sidebar-title">Campus Connect</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="announcements.html" class="nav-link">
          <span class="nav-icon">📢</span>
          <span>Announcements</span>
        </a>
        <a href="events.html" class="nav-link">
          <span class="nav-icon">📅</span>
          <span>Events</span>
        </a>
        <a href="clubs.html" class="nav-link active">
          <span class="nav-icon">🤝</span>
          <span>Clubs</span>
        </a>
        <a href="resources.html" class="nav-link">
          <span class="nav-icon">📚</span>
          <span>Resources</span>
        </a>
        <a href="lostfound.html" class="nav-link">
          <span class="nav-icon">🔍</span>
          <span>Lost & Found</span>
        </a>
        <a href="feedback.html" class="nav-link">
          <span class="nav-icon">💬</span>
          <span>Feedback</span>
        </a>
        <a href="notifications.html" class="nav-link">
          <span class="nav-icon">🔔</span>
          <span>Notifications</span>
        </a>
        <a href="profile.html" class="nav-link">
          <span class="nav-icon">👤</span>
          <span>My Profile</span>
        </a>
        <a href="admin.html" class="nav-link admin-only-nav" style="display: none;">
          <span class="nav-icon">⚙️</span>
          <span>Admin Panel</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-snippet">
          <div id="sidebar-user-avatar" class="user-avatar">U</div>
          <div class="user-details">
            <div id="sidebar-user-name" class="user-name">User</div>
            <span id="sidebar-user-role" class="user-role-badge role-student">student</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Top Navbar -->
      <header class="top-navbar">
        <div class="navbar-left">
          <button id="menu-toggle-btn" class="menu-toggle-btn">☰</button>
          <h1 class="page-title">Clubs & Student Societies</h1>
        </div>

        <div class="navbar-right">
          <a href="notifications.html" class="nav-action-btn" title="Notifications">
            🔔
            <span id="nav-notification-badge" class="badge-count" style="display: none;">0</span>
          </a>
          <a href="profile.html" class="nav-action-btn" title="Profile">👤</a>
          <button onclick="logout()" class="logout-btn-nav">Logout</button>
        </div>
      </header>

      <!-- Content Body -->
      <main class="content-body">
        <div class="page-toolbar">
          <div class="search-filters-group">
            <div class="search-input-wrapper">
              <span class="search-icon-inside">🔍</span>
              <input type="text" id="club-search" placeholder="Search clubs by name or keywords...">
            </div>
          </div>

          <button class="btn btn-primary faculty-admin-only" style="display: none;" onclick="openModal('create-club-modal')">
            + Form New Club
          </button>
        </div>

        <!-- Clubs Grid -->
        <div id="clubs-container" class="items-grid">
          <!-- Dynamically populated by app.js -->
        </div>
      </main>
    </div>
  </div>

  <!-- Create Club Modal (Faculty / Admin) -->
  <div id="create-club-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Register New College Club</h3>
        <button class="modal-close-btn" onclick="closeModal('create-club-modal')">✕</button>
      </div>

      <form id="create-club-form" onsubmit="handleCreateClub(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="club-name">Club Name *</label>
            <input type="text" id="club-name" class="form-control" placeholder="e.g. AI & Robotics Club" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="club-category">Category *</label>
              <input type="text" id="club-category" class="form-control" placeholder="e.g. Technical / Cultural / Sports" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="club-coord">Faculty Coordinator</label>
              <input type="text" id="club-coord" class="form-control" placeholder="e.g. Dr. Alan Turing">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="club-loc">Meeting Location</label>
              <input type="text" id="club-loc" class="form-control" placeholder="e.g. Activity Hall B">
            </div>

            <div class="form-group">
              <label class="form-label" for="club-sched">Meeting Schedule</label>
              <input type="text" id="club-sched" class="form-control" placeholder="e.g. Every Friday at 4:30 PM">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="club-email">Contact Email</label>
            <input type="email" id="club-email" class="form-control" placeholder="club-lead@college.edu">
          </div>

          <div class="form-group">
            <label class="form-label" for="club-desc">Club Description *</label>
            <textarea id="club-desc" class="form-control" rows="3" placeholder="Describe the mission, activities, and workshops hosted by the club..." required></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('create-club-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Register Club</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', loadClubs);
  </script>
</body>
</html>
